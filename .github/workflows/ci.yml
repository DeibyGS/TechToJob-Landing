name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # tsc runs after build: Next.js generates the ambient LayoutProps/PageProps
      # route types into .next/types/ during `next build`, and tsc --noEmit needs
      # them on disk first — running it before build fails on a clean checkout.
      - run: npx tsc --noEmit
